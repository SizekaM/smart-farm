default_config:
template: !include template.yaml


# (Your Lovelace themes, automations, scripts, scenes, etc.)
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script:     !include scripts.yaml
scene:      !include scenes.yaml

mqtt:
  switch:
    - name: "Heater"
      command_topic: "cmnd/YOUR_SONOFF_DEVICE/POWER2"
      state_topic: "stat/YOUR_SONOFF_DEVICE/POWER2"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ON"
      state_off: "OFF"
      qos: 1
      retain: false

    - name: "Fan"
      command_topic: "cmnd/YOUR_SONOFF_DEVICE/POWER3"
      state_topic: "stat/YOUR_SONOFF_DEVICE/POWER3"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ON"
      state_off: "OFF"
      qos: 1
      retain: false

